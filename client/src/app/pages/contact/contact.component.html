<div class="h-screen">
  <div class="mx-auto py-16 sm:py-20">
    <div class="max-w-xl mx-auto px-4 sm:px-6">
      <h2 class="text-center text-7xl font-bold text-white pb-10">
        Get In Touch
      </h2>
      <div
        *ngIf="successMessage"
        class="mb-6 px-4 py-3 rounded bg-green-100 text-green-800 border border-green-300"
      >
        {{ successMessage }}
      </div>

      <div class="relative flex bg-white rounded-lg shadow-md overflow-visible">
        <div class="absolute w-14 -top-6 -left-6 z-30">
          <svg
            width="60"
            height="60"
            viewBox="0 0 205 206"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M142.406 78.1253L136.073 81.6805C117.348 92.1927 93.6838 86.4751 81.8235 68.5731L77.4694 62.0009L81.3321 68.8734C91.8538 87.5935 86.1484 111.261 68.2524 123.13L62.2 127.144L68.533 123.589C87.2584 113.077 110.923 118.794 122.783 136.696L127.137 143.269L123.274 136.396C112.753 117.676 118.458 94.009 136.354 82.1396L142.406 78.1253ZM164.955 63.1732L165.997 64.8786L137.459 83.8063C120.436 95.0967 115.009 117.609 125.018 135.416L142.286 166.14L140.581 167.182L121.116 137.801C109.834 120.772 87.324 115.334 69.512 125.333L39.6512 142.096L38.609 140.391L67.147 121.463C84.17 110.173 89.5971 87.6603 79.5886 69.8534L62.3204 39.13L64.0258 38.0877L83.4908 67.4685C94.7725 84.4972 117.282 89.9359 135.094 79.9366L164.955 63.1732Z"
              fill="black"
            />
          </svg>
        </div>
        <div class="absolute -left-36 top-0 h-full z-50 pointer-events-none">
          <img
            src="assets/images/teacher-contact.png"
            alt="Teacher"
            class="h-full object-contain"
          />
        </div>

        <!-- Contact Form -->
        <form
          [formGroup]="FormData"
          (ngSubmit)="sendEmail($event)"
          class="flex flex-col align-middle relative z-20 bg-white ml-44 pt-24 pb-10 pr-3 rounded-3xl"
        >
          <div class="mb-4">
            <input
              class="appearance-none z-51 border rounded-xl w-full py-2 px-3 text-gray-200 leading-tight focus:outline-none focus:shadow-outline"
              id="name"
              name="from_name"
              formControlName="Name"
              type="text"
              placeholder="Name"
            />
          </div>
          <div class="mb-4">
            <input
              class="appearance-none z-51 border rounded-xl w-full py-2 px-3 text-gray-200 leading-tight focus:outline-none focus:shadow-outline"
              id="email"
              name="from_email"
              formControlName="Email"
              type="Email"
              placeholder="Email"
            />
          </div>
          <div class="mb-4 relative">
            <select
              class="appearance-none z-51 border rounded-xl w-full py-2 px-3 text-gray-200 leading-tight focus:outline-none focus:shadow-outline cursor-pointer pr-8"
              id="subject"
              name="subject"
              formControlName="subject"
            >
              <option
                value=""
                disabled
                selected
                class="text-gray-200 bg-gray-800"
              >
                Subject
              </option>
              <option value="Teacher Looking For Work" class="bg-gray-800 text-gray-200">
                Teacher Looking For Work
              </option>
              <option value="Theatre School Looking for Teachers" class="bg-gray-800 text-gray-200">
                Theatre School Looking for Teachers
              </option>

            </select>
            <div
              class="pointer-events-none absolute inset-y-0 right-3 flex items-center"
            >
              <svg
                class="w-4 h-4 text-gray-400"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
            </div>
          </div>
          <div class="mb-4">
            <textarea
              class="appearance-none z-51 border rounded-xl w-full py-2 px-3 text-gray-200 leading-tight focus:outline-none focus:shadow-outline"
              id="message"
              name="message"
              formControlName="Message"
              rows="6"
              placeholder="Enter your message..."
            ></textarea>
          </div>
          <div class="flex justify-en z-51">
            <button
              [disabled]="!FormData.valid"
              class="send-button hover:bg-blue-500 font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
              type="submit"
            >
              Send
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
